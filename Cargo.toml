[workspace]
resolver = "2"
members = [
    "crates/perfhawk-model",
    "crates/perfhawk-import",
    "crates/perfhawk-analysis",
    "crates/perfhawk-store",
    "crates/perfhawk-capture",
    "crates/perfhawk-server",
    "crates/perfhawk-cli",
    "tools/genprof",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
prost = "0.14"
serde_json = "1"
flate2 = "1"
regex = "1"
stacker = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
bincode = "1.3"
zstd = "0.13"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
rustc-hash = "2"
