[package]
name = "perfhawk-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
perfhawk-model = { path = "../perfhawk-model" }
perfhawk-store = { path = "../perfhawk-store" }
perfhawk-analysis = { path = "../perfhawk-analysis" }
perfhawk-capture = { path = "../perfhawk-capture" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
rust-embed = "8"
mime_guess = "2"
lru = "0.12"
url = "2"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
perfhawk-import = { path = "../perfhawk-import" }
