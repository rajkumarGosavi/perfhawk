[package]
name = "perfhawk-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
perfhawk-model = { path = "../perfhawk-model" }
perfhawk-store = { path = "../perfhawk-store" }
thiserror.workspace = true
ctrlc = "3"
ureq = { version = "2", features = ["json"] }
perfhawk-import = { path = "../perfhawk-import" }
serde.workspace = true
serde_json.workspace = true
object = { version = "0.37", default-features = false, features = ["read"] }

[dev-dependencies]
tempfile.workspace = true
perfhawk-analysis = { path = "../perfhawk-analysis" }
tiny_http = "0.12"
flate2.workspace = true


[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Time",
] }
