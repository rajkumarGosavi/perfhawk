name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache-dependency-path: agents/go/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Go agent
        working-directory: agents/go
        run: |
          go vet ./...
          go test ./...
      - name: .NET helper
        run: dotnet test helpers/perfhawk-dotnet/tests
      - name: Build helper and demo
        run: |
          dotnet publish helpers/perfhawk-dotnet -c Release -o target/helper
          dotnet build examples/dotnet-demo -c Release
      - name: End-to-end capture (Go and .NET)
        shell: bash
        env:
          PERFHAWK_E2E: "1"
        run: |
          # Perfhawk and the target must agree on TMPDIR (Linux/macOS diagnostics sockets).
          unset TMPDIR
          export PERFHAWK_DOTNET="$GITHUB_WORKSPACE/target/helper/perfhawk-dotnet.dll"
          cargo test -p perfhawk-capture -- --include-ignored --test-threads=1
      - name: cargo deny
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
  perf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p perfhawk-store --release --test perf -- --ignored --nocapture
